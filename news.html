  ></script>  <!-- DARKKNIGHT Scripts -->  <script src="js/utils.js"></script>  <script src="js/supabase.js"></script>  <script src="js/theme.js"></script>  <!-- ================================
       News System
  ================================= -->  <script>

    document.addEventListener(
      'DOMContentLoaded',
      async () => {


        /* ================================
           Elements
        ================================= */

        const grid =
          document.getElementById(
            'news-grid'
          );


        const detail =
          document.getElementById(
            'news-detail'
          );


        const errorBox =
          document.getElementById(
            'news-error'
          );


        const pageTitle =
          document.getElementById(
            'page-title'
          );


        const pageDescription =
          document.getElementById(
            'page-description'
          );


        const backButton =
          document.getElementById(
            'back-to-news'
          );


        const errorBackButton =
          document.getElementById(
            'error-back-button'
          );


        const menuToggle =
          document.getElementById(
            'menu-toggle'
          );


        const nav =
          document.getElementById(
            'nav'
          );



        /* ================================
           Mobile Menu
        ================================= */

        menuToggle?.addEventListener(
          'click',
          () => {

            menuToggle.classList.toggle(
              'open'
            );

            nav.classList.toggle(
              'open'
            );

          }
        );



        /* ================================
           Back
        ================================= */

        function goBackToNews() {

          /*
           * If this page was opened from
           * the news list, browser back is
           * the cleanest option.
           */

          if (
            window.history.length > 1 &&
            document.referrer
          ) {

            window.history.back();

          } else {

            window.location.href =
              'news.html';

          }

        }


        backButton?.addEventListener(
          'click',
          goBackToNews
        );


        errorBackButton?.addEventListener(
          'click',
          () => {

            window.location.href =
              'news.html';

          }
        );



        /* ================================
           Supabase Check
        ================================= */

        if (
          !window.DK ||
          !window.DK.isConfigured ||
          !window.DK.supabase
        ) {

          grid.innerHTML = `

            <div class="empty-state">

              <p>
                Supabase تنظیم نشده است.
              </p>

            </div>

          `;

          return;

        }



        /* ================================
           Read URL
        ================================= */

        const params =
          new URLSearchParams(
            window.location.search
          );


        const newsId =
          params.get('id');



        /* ================================
           Detail or List
        ================================= */

        if (newsId) {

          await loadNewsDetail(
            newsId
          );

        } else {

          await loadNews();

        }



        /* ================================
           Load News List
        ================================= */

        async function loadNews() {

          try {


            const {
              data,
              error
            } =
              await window.DK.supabase

                .from('news')

                .select('*')

                .eq(
                  'status',
                  'PUBLISHED'
                )

                .order(
                  'published_at',
                  {
                    ascending: false
                  }
                );


            if (error) {

              throw error;

            }


            if (
              !data ||
              !data.length
            ) {

              grid.innerHTML = `

                <div class="empty-state">

                  <p>
                    خبری نیست
                  </p>

                </div>

              `;

              return;

            }


            grid.innerHTML =
              data
                .map(
                  createNewsCard
                )
                .join('');



            /* ================================
               Card Click
            ================================= */

            grid
              .querySelectorAll(
                '[data-news-id]'
              )
              .forEach(
                card => {


                  card.addEventListener(
                    'click',
                    () => {

                      const id =
                        card.dataset.newsId;

                      if (!id) {
                        return;
                      }


                      window.location.href =
                        `news.html?id=${encodeURIComponent(id)}`;

                    }
                  );



                  /* Keyboard */

                  card.addEventListener(
                    'keydown',
                    event => {

                      if (
                        event.key === 'Enter' ||
                        event.key === ' '
                      ) {

                        event.preventDefault();


                        const id =
                          card.dataset.newsId;


                        if (!id) {
                          return;
                        }


                        window.location.href =
                          `news.html?id=${encodeURIComponent(id)}`;

                      }

                    }
                  );


                }
              );


          } catch (error) {

            console.error(
              'News error:',
              error
            );


            grid.innerHTML = `

              <div class="empty-state">

                <p>
                  خطا در بارگذاری اخبار
                </p>

              </div>

            `;

          }

        }



        /* ================================
           Create News Card
        ================================= */

        function createNewsCard(
          news
        ) {

          const image =
            news.image_url
              ? `

                <img
                  src="${window.DK.escapeHtml(
                    news.image_url
                  )}"
                  alt="${window.DK.escapeHtml(
                    news.title || 'خبر'
                  )}"
                  loading="lazy"
                >

              `
              : '';



          return `

            <article
              class="news-card"
              data-news-id="${window.DK.escapeHtml(
                String(news.id)
              )}"
              tabindex="0"
              role="button"
              aria-label="مشاهده ${window.DK.escapeHtml(
                news.title || 'خبر'
              )}"
            >


              <div class="news-image">

                ${image}

              </div>


              <div class="news-body">


                <div class="news-date">

                  ${window.DK.formatDate(
                    news.published_at ||
                    news.created_at
                  )}

                </div>


                <h3 class="news-title">

                  ${window.DK.escapeHtml(
                    news.title || ''
                  )}

                </h3>


                <p class="news-excerpt">

                  ${window.DK.escapeHtml(
                    news.content || ''
                  )}

                </p>


                <div class="news-read-more">

                  مشاهده متن کامل ←

                </div>


              </div>

            </article>

          `;

        }



        /* ================================
           Load News Detail
        ================================= */

        async function loadNewsDetail(
          id
        ) {


          grid.style.display =
            'none';


          detail.style.display =
            'none';


          errorBox.style.display =
            'none';



          try {


            const {
              data,
              error
            } =
              await window.DK.supabase

                .from('news')

                .select('*')

                .eq(
                  'id',
                  id
                )

                .eq(
                  'status',
                  'PUBLISHED'
                )

                .maybeSingle();



            if (error) {

              throw error;

            }



            if (!data) {

              showNewsError();

              return;

            }



            renderNewsDetail(
              data
            );


          } catch (error) {

            console.error(
              'News detail error:',
              error
            );


            showNewsError();

          }

        }



        /* ================================
           Render Detail
        ================================= */

        function renderNewsDetail(
          news
        ) {


          detail.style.display =
            'block';


          errorBox.style.display =
            'none';


          pageTitle.textContent =
            'جزئیات خبر';


          pageDescription.textContent =
            'خبر کامل DARKKNIGHT STUDIO';



          const title =
            document.getElementById(
              'news-detail-title'
            );


          const date =
            document.getElementById(
              'news-detail-date'
            );


          const content =
            document.getElementById(
              'news-detail-content'
            );


          const image =
            document.getElementById(
              'news-detail-image'
            );



          /* Title */

          title.textContent =
            news.title || 'بدون عنوان';



          /* Date */

          date.textContent =
            window.DK.formatDate(
              news.published_at ||
              news.created_at
            );



          /* Content */

          content.textContent =
            news.content || '';



          /* Image */

          if (news.image_url) {

            image.innerHTML = `

              <img
                src="${window.DK.escapeHtml(
                  news.image_url
                )}"
                alt="${window.DK.escapeHtml(
                  news.title || 'خبر'
                )}"
              >

            `;

          } else {

            image.innerHTML =
              '';

          }



          /* Scroll */

          window.scrollTo({

            top: 0,

            behavior: 'smooth'

          });


        }



        /* ================================
           Error
        ================================= */

        function showNewsError() {


          grid.style.display =
            'none';


          detail.style.display =
            'none';


          errorBox.style.display =
            'block';


          pageTitle.textContent =
            'خبر پیدا نشد';


          pageDescription.textContent =
            'این خبر در دسترس نیست.';



          window.scrollTo({

            top: 0,

            behavior: 'smooth'

          });

        }


      }
    );

  </script></body></html>
