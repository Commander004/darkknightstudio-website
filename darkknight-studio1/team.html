<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عضویت در تیم — DARKKNIGHT STUDIO</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-icon">⚔</span><span class="logo-text">DARKKNIGHT</span></a>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav-link">خانه</a>
        <a href="projects.html" class="nav-link">پروژه‌ها</a>
        <a href="support.html" class="nav-link">پشتیبانی</a>
        <a href="team.html" class="nav-link active">عضویت</a>
        <a href="admin.html" class="nav-link nav-admin">پنل مدیریت</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle">☀</button>
        <button class="menu-toggle" id="menu-toggle"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <div class="page-hero">
    <div class="container">
      <h1>عضویت در تیم</h1>
      <p>می‌خوای به DARKKNIGHT بپیوندی؟ فرم رو پر کن.</p>
    </div>
  </div>

  <section class="section">
    <div class="container" style="max-width:600px">
      <form id="apply-form" class="support-card" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px">
        <div class="form-group">
          <label class="form-label">نام *</label>
          <input class="form-input" id="a-name" required maxlength="80">
        </div>
        <div class="form-group">
          <label class="form-label">نام کاربری</label>
          <input class="form-input" id="a-username" maxlength="50">
        </div>
        <div class="form-group">
          <label class="form-label">سن</label>
          <input class="form-input" id="a-age" type="number" min="12" max="80">
        </div>
        <div class="form-group">
          <label class="form-label">مهارت‌ها *</label>
          <input class="form-input" id="a-skills" required placeholder="مثلاً: Unity, C#, UI Design">
        </div>
        <div class="form-group">
          <label class="form-label">تجربه</label>
          <textarea class="form-textarea" id="a-exp" placeholder="کمی از تجربه‌ات بگو"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">پورتفولیو / لینک کارها</label>
          <input class="form-input" id="a-portfolio" placeholder="https://...">
        </div>
        <div class="form-group">
          <label class="form-label">راه ارتباطی *</label>
          <input class="form-input" id="a-contact" required placeholder="تلگرام / ایمیل / دیسکورد">
        </div>
        <div class="form-group">
          <label class="form-label">پیام</label>
          <textarea class="form-textarea" id="a-message"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">ارسال درخواست</button>
      </form>
    </div>
  </section>

  <div id="toast-container" class="toast-container"></div>

  <script>window.DK_CONFIG = {
     SUPABASE_URL: 'https://exaryvtjayuwgyqnioem.supabase.co',
     SUPABASE_ANON_KEY: 'sb_publishable_qKQQ14qEFz1Z8W1mTWHeEg_RDw0awSR'
};</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/utils.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('menu-toggle')?.addEventListener('click', function() {
        this.classList.toggle('open');
        document.getElementById('nav').classList.toggle('open');
      });

      document.getElementById('apply-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!DK.isConfigured) {
          DK.toast('Supabase تنظیم نشده', 'error');
          return;
        }
        const row = {
          name: document.getElementById('a-name').value.trim(),
          username: document.getElementById('a-username').value.trim() || null,
          age: parseInt(document.getElementById('a-age').value) || null,
          skills: document.getElementById('a-skills').value.trim(),
          experience: document.getElementById('a-exp').value.trim() || null,
          portfolio: document.getElementById('a-portfolio').value.trim() || null,
          contact: document.getElementById('a-contact').value.trim(),
          message: document.getElementById('a-message').value.trim() || null,
          status: 'PENDING'
        };
        try {
          const { error } = await DK.supabase.from('team_applications').insert(row);
          if (error) throw error;
          DK.toast('درخواستت ثبت شد! به زودی بررسی می‌کنیم.', 'success');
          e.target.reset();
        } catch (err) {
          DK.toast('خطا: ' + err.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
