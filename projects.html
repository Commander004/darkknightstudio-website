    /* ================================
       Project Details
    ================================= */

    .project-details {
      max-width: 1000px;
      margin: 0 auto;
    }

    .project-detail-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .project-detail-banner {
      position: relative;
      width: 100%;
      min-height: 280px;
      background: var(--bg);
      overflow: hidden;
    }

    .project-detail-banner img {
      display: block;
      width: 100%;
      max-height: 500px;
      object-fit: cover;
    }

    .project-detail-status {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 2;
    }

    .project-detail-body {
      padding: 32px;
    }

    .project-detail-title {
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .project-detail-description {
      color: var(--text-muted);
      line-height: 2;
      font-size: 1rem;
      white-space: pre-wrap;
      margin-bottom: 28px;
    }

    .project-detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }

    .project-detail-meta .tag,
    .project-detail-meta .tech {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .project-detail-meta .tech {
      color: var(--primary);
    }

    .project-back {
      margin-bottom: 20px;
    }

    .project-back .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .project-card {
      cursor: pointer;
      transition:
        transform var(--transition),
        border-color var(--transition),
        box-shadow var(--transition);
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: color-mix(
        in srgb,
        var(--primary) 45%,
        var(--border)
      );
    }

    .project-card:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    .project-detail-error {
      text-align: center;
      padding: 60px 20px;
    }

    .project-detail-error-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .project-detail-error h2 {
      margin-bottom: 10px;
    }

    .project-detail-error p {
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    @media (max-width: 600px) {

      .project-detail-body {
        padding: 22px;
      }

      .project-detail-banner {
        min-height: 200px;
      }

      .project-detail-title {
        font-size: 1.8rem;
      }

    }

  </script>  <!-- Libraries -->  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>  <!-- DARKKNIGHT Scripts -->  <script src="js/utils.js"></script>  <script src="js/supabase.js"></script>  <script src="js/theme.js"></script>  <!-- Projects -->  <script>

    document.addEventListener(
      'DOMContentLoaded',
      async () => {

        /* ================================
           Elements
        ================================= */

        const grid =
          document.getElementById(
            'projects-grid'
          );

        const details =
          document.getElementById(
            'project-details'
          );

        const errorBox =
          document.getElementById(
            'project-error'
          );

        const pageTitle =
          document.getElementById(
            'page-title'
          );

        const pageDescription =
          document.getElementById(
            'page-description'
          );

        const backButton =
          document.getElementById(
            'back-to-projects'
          );

        const errorBackButton =
          document.getElementById(
            'error-back-button'
          );

        const menuToggle =
          document.getElementById(
            'menu-toggle'
          );

        const nav =
          document.getElementById(
            'nav'
          );


        /* ================================
           Mobile Menu
        ================================= */

        menuToggle?.addEventListener(
          'click',
          () => {

            menuToggle.classList.toggle(
              'open'
            );

            nav.classList.toggle(
              'open'
            );

          }
        );


        /* ================================
           Back
        ================================= */

        function goBack() {

          /*
           * If the browser has a previous
           * page, use it.
           *
           * Otherwise go directly to
           * projects.html.
           */

          if (
            window.history.length > 1 &&
            document.referrer
          ) {

            window.history.back();

          } else {

            window.location.href =
              'projects.html';

          }

        }


        backButton?.addEventListener(
          'click',
          goBack
        );


        errorBackButton?.addEventListener(
          'click',
          () => {

            window.location.href =
              'projects.html';

          }
        );


        /* ================================
           Supabase Check
        ================================= */

        if (
          !window.DK ||
          !window.DK.isConfigured ||
          !window.DK.supabase
        ) {

          grid.innerHTML = `
            <div class="empty-state">
              <p>
                Supabase تنظیم نشده است.
              </p>
            </div>
          `;

          return;

        }


        /* ================================
           URL ID
        ================================= */

        const params =
          new URLSearchParams(
            window.location.search
          );

        const projectId =
          params.get('id');


        /* ================================
           Load Single Project
        ================================= */

        if (projectId) {

          await loadProject(
            projectId
          );

          return;

        }


        /* ================================
           Load All Projects
        ================================= */

        await loadProjects();


        /* ================================
           Load Projects
        ================================= */

        async function loadProjects() {

          try {

            const { data, error } =
              await window.DK.supabase
                .from('projects')
                .select('*')
                .neq(
                  'status',
                  'ARCHIVED'
                )
                .order(
                  'display_order'
                );


            if (error) {

              throw error;

            }


            if (!data?.length) {

              grid.innerHTML = `
                <div class="empty-state">
                  <p>
                    پروژه‌ای نیست
                  </p>
                </div>
              `;

              return;

            }


            grid.innerHTML =
              data
                .map(
                  (project) =>
                    createProjectCard(
                      project
                    )
                )
                .join('');


            /*
             * Add click handlers
             */

            grid
              .querySelectorAll(
                '[data-project-id]'
              )
              .forEach(
                (card) => {

                  card.addEventListener(
                    'click',
                    () => {

                      const id =
                        card.dataset.projectId;

                      if (!id) {
                        return;
                      }

                      window.location.href =
                        `projects.html?id=${encodeURIComponent(id)}`;

                    }
                  );


                  /*
                   * Keyboard accessibility
                   */

                  card.addEventListener(
                    'keydown',
                    (event) => {

                      if (
                        event.key === 'Enter' ||
                        event.key === ' '
                      ) {

                        event.preventDefault();

                        const id =
                          card.dataset.projectId;

                        if (!id) {
                          return;
                        }

                        window.location.href =
                          `projects.html?id=${encodeURIComponent(id)}`;

                      }

                    }
                  );

                }
              );


          } catch (error) {

            console.error(
              'Projects error:',
              error
            );

            grid.innerHTML = `
              <div class="empty-state">
                <p>
                  خطا در بارگذاری پروژه‌ها
                </p>
              </div>
            `;

          }

        }


        /* ================================
           Project Card
        ================================= */

        function createProjectCard(
          project
        ) {

          const tags =
            Array.isArray(project.tags)
              ? project.tags
              : [];


          const technologies =
            Array.isArray(
              project.technologies
            )
              ? project.technologies
              : [];


          const banner =
            project.banner_url
              ? `
                <img
                  src="${window.DK.escapeHtml(project.banner_url)}"
                  alt="${window.DK.escapeHtml(project.title || 'پروژه')}"
                  loading="lazy"
                >
              `
              : '';


          return `

            <article
              class="project-card"
              data-project-id="${window.DK.escapeHtml(String(project.id))}"
              tabindex="0"
              role="button"
              aria-label="مشاهده جزئیات ${window.DK.escapeHtml(project.title || 'پروژه')}"
            >

              <div class="project-banner">

                ${banner}

                <span
                  class="project-status ${window.DK.statusClass(project.status)}"
                >
                  ${window.DK.statusLabel(project.status)}
                </span>

              </div>


              <div class="project-body">

                <h3 class="project-title">

                  ${window.DK.escapeHtml(
                    project.title || ''
                  )}

                </h3>


                <p class="project-desc">

                  ${window.DK.escapeHtml(
                    project.description || ''
                  )}

                </p>


                <div class="project-meta">

                  ${tags
                    .map(
                      (tag) =>
                        `<span class="tag">${window.DK.escapeHtml(tag)}</span>`
                    )
                    .join('')}


                  ${technologies
                    .map(
                      (tech) =>
                        `<span class="tech">${window.DK.escapeHtml(tech)}</span>`
                    )
                    .join('')}

                </div>


                <div
                  style="
                    margin-top: 18px;
                    color: var(--primary);
                    font-size: 0.9rem;
                    font-weight: 600;
                  "
                >
                  مشاهده جزئیات ←
                </div>

              </div>

            </article>

          `;

        }


        /* ================================
           Load Single Project
        ================================= */

        async function loadProject(
          id
        ) {

          /*
           * Hide list
           */

          grid.style.display =
            'none';

          errorBox.style.display =
            'none';

          details.style.display =
            'none';


          try {

            const { data, error } =
              await window.DK.supabase
                .from('projects')
                .select('*')
                .eq(
                  'id',
                  id
                )
                .neq(
                  'status',
                  'ARCHIVED'
                )
                .maybeSingle();


            if (error) {

              throw error;

            }


            /*
             * Project not found
             */

            if (!data) {

              showProjectError();

              return;

            }


            renderProjectDetails(
              data
            );


          } catch (error) {

            console.error(
              'Project detail error:',
              error
            );

            showProjectError();

          }

        }


        /* ================================
           Render Details
        ================================= */

        function renderProjectDetails(
          project
        ) {

          details.style.display =
            'block';

          errorBox.style.display =
            'none';


          pageTitle.textContent =
            'جزئیات پروژه';

          pageDescription.textContent =
            'اطلاعات کامل پروژه DARKKNIGHT STUDIO';


          const detailTitle =
            document.getElementById(
              'project-detail-title'
            );


          const detailDescription =
            document.getElementById(
              'project-detail-description'
            );


          const detailMeta =
            document.getElementById(
              'project-detail-meta'
            );


          const detailBanner =
            document.getElementById(
              'project-detail-banner'
            );


          detailTitle.textContent =
            project.title || 'بدون عنوان';


          detailDescription.textContent =
            project.description || '';


          /*
           * Banner
           */

          if (project.banner_url) {

            detailBanner.innerHTML = `
              <img
                src="${window.DK.escapeHtml(project.banner_url)}"
                alt="${window.DK.escapeHtml(project.title || 'پروژه')}"
              >
            `;

          } else {

            detailBanner.innerHTML = '';

          }


          /*
           * Status
           */

          let metaHTML = '';

          metaHTML += `
            <span
              class="project-status ${window.DK.statusClass(project.status)}"
            >
              ${window.DK.statusLabel(project.status)}
            </span>
          `;


          /*
           * Tags
           */

          if (
            Array.isArray(project.tags)
          ) {

            metaHTML +=
              project.tags
                .map(
                  (tag) =>
                    `<span class="tag">${window.DK.escapeHtml(tag)}</span>`
                )
                .join('');

          }


          /*
           * Technologies
           */

          if (
            Array.isArray(
              project.technologies
            )
          ) {

            metaHTML +=
              project.technologies
                .map(
                  (tech) =>
                    `<span class="tech">${window.DK.escapeHtml(tech)}</span>`
                )
                .join('');

          }


          detailMeta.innerHTML =
            metaHTML;


          /*
           * Scroll to top
           */

          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });

        }


        /* ================================
           Error
        ================================= */

        function showProjectError() {

          grid.style.display =
            'none';

          details.style.display =
            'none';

          errorBox.style.display =
            'block';

          pageTitle.textContent =
            'پروژه پیدا نشد';

          pageDescription.textContent =
            'این پروژه در دسترس نیست.';

          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });

        }

      }
    );

  </script></body></html>
